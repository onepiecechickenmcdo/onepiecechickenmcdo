<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="256" viewBox="0 0 1200 256" role="img" aria-labelledby="title desc">
  <title id="title">Contribution route map</title>
  <desc id="desc">AsikaGo’s business registration roadmap, Assay Research’s 20th-place finish in the Bifrost track, and Pokéfolio in development.</desc>
  <rect width="1200" height="256" fill="#191d24"/>
  <rect x="72" y="20" width="1056" height="216" rx="10" fill="#f7f3e9"/>
  <path d="M250 79h700" stroke="#a53223" stroke-width="2" stroke-dasharray="6 6"/>
  <g stroke="#a53223" stroke-width="3">
    <circle cx="250" cy="79" r="8" fill="#a53223"/>
    <circle cx="600" cy="79" r="8" fill="#a53223"/>
    <circle cx="950" cy="79" r="8" fill="#f7f3e9"/>
  </g>
  <g text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">
    <g fill="#574f40" font-weight="700" font-size="18" letter-spacing="2">
      <text x="250" y="118">OCTOBER 2026</text>
      <text x="600" y="118">NOVEMBER 2026</text>
      <text x="950" y="118">IN DEVELOPMENT</text>
    </g>
    <g fill="#12233d" font-size="30" font-weight="700">
      <text x="250" y="160">AsikaGo</text>
      <text x="600" y="160">Assay Research</text>
      <text x="950" y="160">Pokéfolio</text>
    </g>
    <g fill="#574f40" font-size="20">
      <text x="250" y="199">Registration roadmap</text>
      <text x="600" y="199">20th in the Bifrost track</text>
      <text x="950" y="199">Pokémon-inspired portfolio</text>
    </g>
  </g>
</svg>
