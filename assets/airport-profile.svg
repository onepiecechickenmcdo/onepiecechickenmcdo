  <title id="profile-title">Krystelle M. Eledia’s boarding pass, projects, and flight log</title>
  <desc id="profile-desc">Krystelle M. Eledia’s route from Assay Research to Pokéfolio. Assay Research placed 20th out of 233 teams in the Bifrost track of the Global AI Hackathon 2026, which drew more than 3,600 participants. The flight log shows 39 public contributions over 12 weeks.</desc>
